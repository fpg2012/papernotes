<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#1a1a2e"/></marker>
  </defs>
  <style>
    .title { font-size: 17px; font-weight: 700; fill: #1a1a2e; }
    .subtitle { font-size: 13px; font-weight: 600; fill: #5b6475; }
    .label { font-size: 13px; fill: #1a1a2e; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 11px; fill: #5b6475; text-anchor: middle; }
    .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .cell-coal { fill: #7dd3fc; stroke: #0369a1; stroke-width: 1; rx: 1; }
    .cell-uncoal { fill: #fca5a5; stroke: #dc2626; stroke-width: 1; rx: 1; }
    .cell-gray { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; rx: 1; }
    .warp-bg { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 3; }
    .zone-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
    .tag { font-size: 10px; fill: #fff; text-anchor: middle; dominant-baseline: middle; font-weight: 600; }
  </style>

  <text x="350" y="25" text-anchor="middle" class="title" font-size="18">GPU Memory Coalescing: Coalesced vs Uncoalesced</text>

  <!-- LEFT: Uncoalesced -->
  <rect x="20" y="45" width="320" height="320" class="zone-box"/>
  <text x="180" y="70" text-anchor="middle" class="subtitle" fill="#dc2626">❌ Uncoalesced (列优先遍历)</text>
  <text x="180" y="87" text-anchor="middle" class="small">同一 warp 的线程访问非连续地址 → 多次内存事务</text>

  <!-- Thread grid -->
  <g transform="translate(40, 105)">
    <text x="80" y="-5" text-anchor="middle" class="small" font-weight="600">Thread 0..15 (warp 0)</text>
    <rect x="0" y="5" width="24" height="18" class="cell-uncoal"/><text x="12" y="14" class="tag" fill="#fff" font-size="9">0</text>
    <rect x="0" y="25" width="24" height="18" class="cell-uncoal"/><text x="12" y="34" class="tag" fill="#fff" font-size="9">1</text>
    <rect x="0" y="45" width="24" height="18" class="cell-uncoal"/><text x="12" y="54" class="tag" fill="#fff" font-size="9">2</text>
    <rect x="0" y="65" width="24" height="18" class="cell-uncoal"/><text x="12" y="74" class="tag" fill="#fff" font-size="9">3</text>
    <rect x="0" y="85" width="24" height="18" class="cell-uncoal"/><text x="12" y="94" class="tag" fill="#fff" font-size="9">4</text>
    <rect x="0" y="105" width="24" height="18" class="cell-uncoal"/><text x="12" y="114" class="tag" fill="#fff" font-size="9">5</text>
    <rect x="0" y="125" width="24" height="18" class="cell-uncoal"/><text x="12" y="134" class="tag" fill="#fff" font-size="9">6</text>
    <rect x="0" y="145" width="24" height="18" class="cell-uncoal"/><text x="12" y="154" class="tag" fill="#fff" font-size="9">7</text>
    <rect x="0" y="165" width="24" height="18" class="cell-uncoal"/><text x="12" y="174" class="tag" fill="#fff" font-size="9">...</text>
    <text x="12" y="198" class="small" font-size="10">T0..T15</text>
    <text x="12" y="212" class="small" font-size="10">按列访问</text>
  </g>

  <!-- DRAM addresses -->
  <g transform="translate(230, 105)">
    <text x="50" y="-5" text-anchor="middle" class="small" font-weight="600">DRAM 地址空间</text>
    <rect x="0" y="6" width="40" height="17" class="cell-uncoal"/><text x="20" y="14" class="tag" fill="#fff" font-size="8">a₀</text>
    <rect x="0" y="26" width="40" height="17" class="cell-gray"/><text x="20" y="34" class="tag" fill="#5b6475" font-size="8">(跳)</text>
    <rect x="0" y="46" width="40" height="17" class="cell-uncoal"/><text x="20" y="54" class="tag" fill="#fff" font-size="8">a₁</text>
    <rect x="0" y="66" width="40" height="17" class="cell-gray"/><text x="20" y="74" class="tag" fill="#5b6475" font-size="8">(跳)</text>
    <rect x="0" y="86" width="40" height="17" class="cell-uncoal"/><text x="20" y="94" class="tag" fill="#fff" font-size="8">a₂</text>
    <rect x="0" y="106" width="40" height="17" class="cell-gray"/><text x="20" y="114" class="tag" fill="#5b6475" font-size="8">(跳)</text>
    <rect x="0" y="126" width="40" height="17" class="cell-uncoal"/><text x="20" y="134" class="tag" fill="#fff" font-size="8">a₃</text>
    <rect x="0" y="146" width="40" height="17" class="cell-gray"/><text x="20" y="154" class="tag" fill="#5b6475" font-size="8">(跳)</text>
    <rect x="0" y="166" width="40" height="17" class="cell-uncoal"/><text x="20" y="174" class="tag" fill="#fff" font-size="8">a₄</text>
  </g>

  <!-- Arrow showing non-contiguous access -->
  <path d="M 105 170 L 220 170" class="edge" marker-end="url(#arrow)" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="162" y="163" class="small" font-size="10" fill="#dc2626">非连续访问</text>

  <!-- Hint: multiple transactions -->
  <rect x="40" y="270" width="280" height="40" fill="#fecaca" stroke="#dc2626" rx="4"/>
  <text x="180" y="286" text-anchor="middle" class="small" fill="#991b1b" font-weight="600">需要 N 次单独内存事务 → 带宽浪费</text>
  <text x="180" y="300" text-anchor="middle" class="small" fill="#991b1b">每次仅利用 1/N 的传输宽度</text>

  <!-- RIGHT: Coalesced -->
  <rect x="360" y="45" width="320" height="320" class="zone-box"/>
  <text x="520" y="70" text-anchor="middle" class="subtitle" fill="#0369a1">✅ Coalesced (行优先遍历)</text>
  <text x="520" y="87" text-anchor="middle" class="small">同一 warp 的线程访问连续地址 → 合并为一次宽位传输</text>

  <!-- Thread grid - row-major -->
  <g transform="translate(380, 105)">
    <text x="80" y="-5" text-anchor="middle" class="small" font-weight="600">Thread 0..15 (warp 0)</text>
    <rect x="0" y="5" width="24" height="18" class="cell-coal"/><text x="12" y="14" class="tag" fill="#fff" font-size="9">0</text>
    <rect x="26" y="5" width="24" height="18" class="cell-coal"/><text x="38" y="14" class="tag" fill="#fff" font-size="9">1</text>
    <rect x="52" y="5" width="24" height="18" class="cell-coal"/><text x="64" y="14" class="tag" fill="#fff" font-size="9">2</text>
    <rect x="78" y="5" width="24" height="18" class="cell-coal"/><text x="90" y="14" class="tag" fill="#fff" font-size="9">3</text>
    <rect x="104" y="5" width="24" height="18" class="cell-coal"/><text x="116" y="14" class="tag" fill="#fff" font-size="9">4</text>
    <rect x="130" y="5" width="24" height="18" class="cell-coal"/><text x="142" y="14" class="tag" fill="#fff" font-size="9">5</text>
    <rect x="0" y="28" width="24" height="18" class="cell-coal"/><text x="12" y="37" class="tag" fill="#fff" font-size="9">6</text>
    <rect x="26" y="28" width="24" height="18" class="cell-coal"/><text x="38" y="37" class="tag" fill="#fff" font-size="9">7</text>
    <rect x="52" y="28" width="24" height="18" class="cell-coal"/><text x="64" y="37" class="tag" fill="#fff" font-size="9">8</text>
    <rect x="78" y="28" width="24" height="18" class="cell-coal"/><text x="90" y="37" class="tag" fill="#fff" font-size="9">9</text>
    <rect x="104" y="28" width="24" height="18" class="cell-coal"/><text x="116" y="37" class="tag" fill="#fff" font-size="9">10</text>
    <rect x="130" y="28" width="24" height="18" class="cell-coal"/><text x="142" y="37" class="tag" fill="#fff" font-size="9">11</text>
    <rect x="0" y="51" width="24" height="18" class="cell-coal"/><text x="12" y="60" class="tag" fill="#fff" font-size="9">12</text>
    <rect x="26" y="51" width="24" height="18" class="cell-coal"/><text x="38" y="60" class="tag" fill="#fff" font-size="9">13</text>
    <rect x="52" y="51" width="24" height="18" class="cell-coal"/><text x="64" y="60" class="tag" fill="#fff" font-size="9">14</text>
    <rect x="78" y="51" width="24" height="18" class="cell-coal"/><text x="90" y="60" class="tag" fill="#fff" font-size="9">15</text>
    <text x="12" y="88" class="small" font-size="10">T0..T15</text>
    <text x="12" y="102" class="small" font-size="10">按行访问</text>
  </g>

  <!-- DRAM addresses - contiguous -->
  <g transform="translate(570, 105)">
    <text x="50" y="-5" text-anchor="middle" class="small" font-weight="600">DRAM 地址空间</text>
    <rect x="0" y="6" width="40" height="17" class="cell-coal"/><text x="20" y="14" class="tag" fill="#fff" font-size="8">a₀</text>
    <rect x="42" y="6" width="40" height="17" class="cell-coal"/><text x="62" y="14" class="tag" fill="#fff" font-size="8">a₁</text>
    <rect x="0" y="26" width="40" height="17" class="cell-coal"/><text x="20" y="34" class="tag" fill="#fff" font-size="8">a₂</text>
    <rect x="42" y="26" width="40" height="17" class="cell-coal"/><text x="62" y="34" class="tag" fill="#fff" font-size="8">a₃</text>
    <rect x="0" y="46" width="40" height="17" class="cell-coal"/><text x="20" y="54" class="tag" fill="#fff" font-size="8">a₄</text>
    <rect x="42" y="46" width="40" height="17" class="cell-coal"/><text x="62" y="54" class="tag" fill="#fff" font-size="8">a₅</text>
    <rect x="0" y="66" width="40" height="17" class="cell-coal"/><text x="20" y="74" class="tag" fill="#fff" font-size="8">a₆</text>
    <rect x="42" y="66" width="40" height="17" class="cell-coal"/><text x="62" y="74" class="tag" fill="#fff" font-size="8">a₇</text>
    <text x="20" y="98" class="small" font-size="10">...</text>
  </g>

  <!-- Arrow showing contiguous access -->
  <path d="M 515 90 L 560 90" class="edge" marker-end="url(#arrow)"/>
  <text x="537" y="83" class="small" font-size="10" fill="#0369a1">连续访问</text>

  <!-- Wrap bracket showing coalesced -->
  <rect x="380" y="170" width="200" height="85" class="warp-bg"/>
  <text x="700" y="175" class="small" font-size="10" fill="#0369a1">Warp: 16 线程</text>
  <text x="700" y="190" class="small" font-size="10" fill="#0369a1">单次 128B 宽传输</text>
  <text x="700" y="205" class="small" font-size="10" fill="#0369a1">覆盖全部 16 个地址</text>

  <!-- Hint: single transaction -->
  <rect x="380" y="270" width="280" height="40" fill="#bae6fd" stroke="#0369a1" rx="4"/>
  <text x="520" y="286" text-anchor="middle" class="small" fill="#0369a1" font-weight="600">合并为单次宽位传输 → 满带宽利用</text>
  <text x="520" y="300" text-anchor="middle" class="small" fill="#0369a1">编译器自动重排为行优先遍历即可实现</text>
</svg>
