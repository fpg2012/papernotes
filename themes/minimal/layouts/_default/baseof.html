<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="/papers/css/style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="/papers/">{{ .Site.Title }}</a>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <small>Built with Hugo · Papers: {{ len (where .Site.RegularPages "Section" "papers") }}</small>
  </footer>
</body>
</html>
